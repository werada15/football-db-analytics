services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: FootballDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: werada
    ports:
      - "5432:5432"
    volumes:
      - ./1_database/00_tables_create.sql:/docker-entrypoint-initdb.d/00_tables_create.sql:ro
      - ./1_database/01_data_insert.sql:/docker-entrypoint-initdb.d/01_data_insert.sql:ro
      - ./2_analytics/analytic_views.sql:/docker-entrypoint-initdb.d/02_analytic_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FootballDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: FootballDB
      DB_USER: postgres
      DB_PASSWORD: werada
      DB_HOST: db
      DB_PORT: "5432"